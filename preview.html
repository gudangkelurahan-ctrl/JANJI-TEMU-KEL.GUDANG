<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Admin - Janji Temu</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f1f5f9;
    color: #1e293b;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    width: 240px;
    height: 100vh;
    background: #087f5b;
    color: white;
    padding: 25px 15px;
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 35px;
}

.sidebar a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 13px 15px;
    margin-bottom: 8px;
    border-radius: 7px;
}

.sidebar a:hover,
.sidebar a.active {
    background: rgba(255,255,255,0.18);
}

/* MAIN */
.main {
    margin-left: 240px;
    padding: 30px;
}

/* HEADER */
.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.top h1 {
    margin: 0;
}

.admin {
    background: white;
    padding: 10px 15px;
    border-radius: 8px;
}

/* STATISTIK */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.stat h3 {
    margin: 0;
    font-size: 14px;
    color: #64748b;
}

.stat p {
    font-size: 30px;
    font-weight: bold;
    margin: 10px 0 0;
    color: #087f5b;
}

/* CARD */
.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.card h2 {
    margin-top: 0;
}

/* FILTER */
.filter {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.filter input,
.filter select {
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
}

/* TABLE */
.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 13px 10px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
}

th {
    background: #f8fafc;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.menunggu {
    background: #fff3bf;
    color: #b7791f;
}

.disetujui {
    background: #d3f9d8;
    color: #2b8a3e;
}

.selesai {
    background: #d0ebff;
    color: #1864ab;
}

.ditolak {
    background: #ffe3e3;
    color: #c92a2a;
}

/* BUTTON */
.btn {
    border: none;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    margin: 2px;
}

.btn-detail {
    background: #1971c2;
}

.btn-setuju {
    background: #2b8a3e;
}

.btn-tolak {
    background: #c92a2a;
}

/* RESPONSIVE */
@media(max-width: 900px) {

    .sidebar {
        width: 200px;
    }

    .main {
        margin-left: 200px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 600px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
        padding: 15px;
    }

    .top {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .filter {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>ADMIN</h2>

    <a href="#" class="active">
        📊 Dashboard
    </a>

    <a href="#">
        📅 Janji Temu
    </a>

    <a href="#">
        👥 Data Pemohon
    </a>

    <a href="#">
        📋 Laporan
    </a>

    <a href="#">
        ⚙ Pengaturan
    </a>

</div>


<!-- MAIN -->
<div class="main">

    <div class="top">

        <div>
            <h1>Dashboard Admin</h1>
            <p>Informasi Janji Temu Pelayanan</p>
        </div>

        <div class="admin">
            👤 Administrator
        </div>

    </div>


    <!-- STATISTIK -->
    <div class="stats">

        <div class="stat">
            <h3>Total Janji Temu</h3>
            <p id="total">0</p>
        </div>

        <div class="stat">
            <h3>Menunggu Konfirmasi</h3>
            <p id="menunggu">0</p>
        </div>

        <div class="stat">
            <h3>Disetujui</h3>
            <p id="disetujui">0</p>
        </div>

        <div class="stat">
            <h3>Selesai</h3>
            <p id="selesai">0</p>
        </div>

    </div>


    <!-- DATA JANJI TEMU -->
    <div class="card">

        <h2>Daftar Janji Temu</h2>

        <div class="filter">

            <input
                type="text"
                id="search"
                placeholder="Cari nama / NIK / booking..."
                onkeyup="filterData()">

            <select
                id="statusFilter"
                onchange="filterData()">

                <option value="">
                    Semua Status
                </option>

                <option value="Menunggu">
                    Menunggu
                </option>

                <option value="Disetujui">
                    Disetujui
                </option>

                <option value="Selesai">
                    Selesai
                </option>

                <option value="Ditolak">
                    Ditolak
                </option>

            </select>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>No</th>
                        <th>Booking</th>
                        <th>Nama</th>
                        <th>NIK</th>
                        <th>Layanan</th>
                        <th>Tanggal</th>
                        <th>Jam</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>

                </thead>

                <tbody id="dataTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* DATA CONTOH */

let data = [

    {
        booking: "JT-20261008-1001",
        nama: "Budi Santoso",
        nik: "3271010101010001",
        layanan: "Administrasi Kependudukan",
        tanggal: "2026-10-09",
        jam: "08:00",
        status: "Menunggu"
    },

    {
        booking: "JT-20261008-1002",
        nama: "Siti Aminah",
        nik: "3271010101010002",
        layanan: "Surat Keterangan",
        tanggal: "2026-10-09",
        jam: "09:00",
        status: "Disetujui"
    },

    {
        booking: "JT-20261008-1003",
        nama: "Dedi Saputra",
        nik: "3271010101010003",
        layanan: "Ahli Waris",
        tanggal: "2026-10-10",
        jam: "10:00",
        status: "Selesai"
    },

    {
        booking: "JT-20261008-1004",
        nama: "Rina Marlina",
        nik: "3271010101010004",
        layanan: "Konsultasi Pelayanan",
        tanggal: "2026-10-10",
        jam: "13:00",
        status: "Menunggu"
    }

];


/* TAMPILKAN DATA */

function tampilkanData(dataTampil = data) {

    const table =
        document.getElementById("dataTable");

    table.innerHTML = "";

    dataTampil.forEach((item, index) => {

        let statusClass =
            item.status.toLowerCase();

        let row = `

        <tr>

            <td>${index + 1}</td>

            <td>
                <b>${item.booking}</b>
            </td>

            <td>${item.nama}</td>

            <td>${item.nik}</td>

            <td>${item.layanan}</td>

            <td>${item.tanggal}</td>

            <td>${item.jam}</td>

            <td>
                <span class="status ${statusClass}">
                    ${item.status}
                </span>
            </td>

            <td>

                <button
                    class="btn btn-detail"
                    onclick="detail('${item.booking}')">
                    Detail
                </button>

                ${
                    item.status === "Menunggu"
                    ?
                    `
                    <button
                        class="btn btn-setuju"
                        onclick="setujui('${item.booking}')">
                        Setuju
                    </button>

                    <button
                        class="btn btn-tolak"
                        onclick="tolak('${item.booking}')">
                        Tolak
                    </button>
                    `
                    :
                    ""
                }

            </td>

        </tr>

        `;

        table.innerHTML += row;

    });

    updateStatistik();

}


/* STATISTIK */

function updateStatistik() {

    document.getElementById("total")
        .textContent = data.length;

    document.getElementById("menunggu")
        .textContent =
        data.filter(
            x => x.status === "Menunggu"
        ).length;

    document.getElementById("disetujui")
        .textContent =
        data.filter(
            x => x.status === "Disetujui"
        ).length;

    document.getElementById("selesai")
        .textContent =
        data.filter(
            x => x.status === "Selesai"
        ).length;
}


/* DETAIL */

function detail(booking) {

    const item =
        data.find(
            x => x.booking === booking
        );

    alert(
        "DETAIL JANJI TEMU\n\n" +

        "Nomor Booking: " +
        item.booking +

        "\nNama: " +
        item.nama +

        "\nNIK: " +
        item.nik +

        "\nLayanan: " +
        item.layanan +

        "\nTanggal: " +
        item.tanggal +

        "\nJam: " +
        item.jam +

        "\nStatus: " +
        item.status
    );

}


/* SETUJUI */

function setujui(booking) {

    const item =
        data.find(
            x => x.booking === booking
        );

    item.status = "Disetujui";

    tampilkanData();

}


/* TOLAK */

function tolak(booking) {

    const item =
        data.find(
            x => x.booking === booking
        );

    item.status = "Ditolak";

    tampilkanData();

}


/* PENCARIAN */

function filterData() {

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const status =
        document.getElementById("statusFilter")
        .value;

    const hasil =
        data.filter(item => {

            const cocokSearch =
                item.nama.toLowerCase()
                .includes(search) ||

                item.nik.includes(search) ||

                item.booking.toLowerCase()
                .includes(search);

            const cocokStatus =
                status === "" ||
                item.status === status;

            return cocokSearch &&
                   cocokStatus;

        });

    tampilkanData(hasil);

}


/* JALANKAN */

tampilkanData();

</script>

</body>
</html>
