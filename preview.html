<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Janji Temu - Kelurahan Gudang</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f6f9;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            color: #126b9e;
            font-size: 28px;
        }

        .header h2 {
            margin: 8px 0;
            font-size: 20px;
            color: #333;
        }

        .header p {
            color: #777;
            margin-bottom: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #126b9e;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .required {
            color: red;
        }

        .info {
            background: #eef7fc;
            border-left: 4px solid #126b9e;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #126b9e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d557e;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px auto;
                padding: 10px;
            }

            .card {
                padding: 20px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <h1>JANJI TEMU</h1>
            <h2>KELURAHAN GUDANG</h2>
            <p>Kecamatan Bogor Tengah</p>
        </div>

        <div class="info">
            Silakan isi formulir berikut untuk mengajukan janji temu
            dengan petugas pelayanan Kelurahan Gudang.
        </div>

        <form id="janjiTemuForm">

            <div class="form-group">
                <label>Nama Pemohon <span class="required">*</span></label>
                <input type="text" name="nama" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="form-group">
                <label>NIK <span class="required">*</span></label>
                <input type="text"
                       name="nik"
                       placeholder="Masukkan NIK"
                       maxlength="16"
                       inputmode="numeric"
                       required>
            </div>

            <div class="form-group">
                <label>No. Handphone <span class="required">*</span></label>
                <input type="tel"
                       name="no_hp"
                       placeholder="Contoh: 081234567890"
                       required>
            </div>

            <div class="form-group">
                <label>Alamat</label>
                <textarea name="alamat"
                          placeholder="Masukkan alamat lengkap"></textarea>
            </div>

            <div class="form-group">
                <label>Layanan yang Dituju <span class="required">*</span></label>

                <select name="layanan" required>
                    <option value="">-- Pilih Layanan --</option>
                    <option value="Administrasi Kependudukan">
                        Administrasi Kependudukan
                    </option>
                    <option value="Surat Keterangan">
                        Surat Keterangan
                    </option>
                    <option value="Ahli Waris">
                        Ahli Waris
                    </option>
                    <option value="Domisili">
                        Surat Keterangan Domisili
                    </option>
                    <option value="Pelayanan Umum">
                        Pelayanan Umum
                    </option>
                    <option value="Konsultasi">
                        Konsultasi
                    </option>
                    <option value="Lainnya">
                        Lainnya
                    </option>
                </select>
            </div>

            <div class="row">

                <div class="form-group">
                    <label>Tanggal Janji Temu <span class="required">*</span></label>
                    <input type="date"
                           id="tanggal"
                           name="tanggal"
                           required>
                </div>

                <div class="form-group">
                    <label>Jam <span class="required">*</span></label>

                    <select name="jam" required>
                        <option value="">-- Pilih Jam --</option>
                        <option value="08:00">08:00</option>
                        <option value="08:30">08:30</option>
                        <option value="09:00">09:00</option>
                        <option value="09:30">09:30</option>
                        <option value="10:00">10:00</option>
                        <option value="10:30">10:30</option>
                        <option value="11:00">11:00</option>
                        <option value="11:30">11:30</option>
                        <option value="13:00">13:00</option>
                        <option value="13:30">13:30</option>
                        <option value="14:00">14:00</option>
                        <option value="14:30">14:30</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label>Nama Petugas yang Dituju</label>

                <select name="petugas">
                    <option value="">-- Pilih Petugas --</option>
                    <option value="Petugas Pelayanan">
                        Petugas Pelayanan
                    </option>
                    <option value="Sekretaris Kelurahan">
                        Sekretaris Kelurahan
                    </option>
                    <option value="Lurah">
                        Lurah
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Keperluan / Catatan <span class="required">*</span></label>

                <textarea name="keperluan"
                          placeholder="Jelaskan keperluan janji temu"
                          required></textarea>
            </div>

            <div class="form-group">
                <label>Upload Dokumen Pendukung</label>
                <input type="file"
                       name="dokumen"
                       accept=".jpg,.jpeg,.png,.pdf">
            </div>

            <button type="submit">
                AJUKAN JANJI TEMU
            </button>

        </form>

        <div class="footer">
            Kelurahan Gudang Kecamatan Bogor Tengah
            <br>
            Sistem Janji Temu Pelayanan
        </div>

    </div>

</div>

<script>

    // Membatasi tanggal agar tidak bisa memilih tanggal yang sudah lewat
    const tanggal = document.getElementById("tanggal");

    const hariIni = new Date();
    const tahun = hariIni.getFullYear();
    const bulan = String(hariIni.getMonth() + 1).padStart(2, "0");
    const hari = String(hariIni.getDate()).padStart(2, "0");

    tanggal.min = `${tahun}-${bulan}-${hari}`;


    // Saat form dikirim
    document.getElementById("janjiTemuForm").addEventListener("submit", function(event) {

        event.preventDefault();

        alert(
            "Pengajuan Janji Temu berhasil dikirim.\n\n" +
            "Silakan menunggu konfirmasi dari petugas."
        );

    });

</script>

</body>
</html>
